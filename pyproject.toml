[project]
name = "fastapi-llm-app"
version = "0.1.0"
description = "Authenticated FastAPI LLM service with native frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi-cloud-cli>=0.27.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.7.0",
]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

